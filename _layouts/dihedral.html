<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "Dihedral Playground" }} - {{ site.title }}</title>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom styles -->
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --primary-color: #38bdf8;
            --accent-color: #fb7185;
            --header-height: 60px;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        header {
            height: var(--header-height);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid #334155;
            z-index: 100;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 10px;
            border-radius: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--primary-color);
        }

        main {
            height: calc(100vh - var(--header-height));
            display: grid;
            grid-template-columns: 300px 1fr 340px;
            overflow: hidden;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 250px 1fr 300px;
            }
        }
        
        @media (max-width: 768px) {
            main {
                display: flex;
                flex-direction: column;
            }
            .visual-area {
                height: 50vh;
            }
            .side-panel {
                height: 25vh;
                border: none;
                border-top: 1px solid #334155;
            }
        }

        .visual-area {
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            position: relative;
        }

        .playground-container {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            touch-action: none;
        }

        .side-panel {
            background: #1e293b;
            border-left: 1px solid #334155;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <header>
        <div class="flex items-center">
            <a href="/apps/" class="icon-btn" title="Back to Apps">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h1 id="app-title" class="text-lg font-bold ml-2">Dihedral Playground</h1>
        </div>
        <div class="flex items-center gap-2">
            <button class="icon-btn" title="Save Assembly" id="save-assembly-btn"><i class="bi bi-bookmark"></i></button>
            <button class="icon-btn" title="Toggle Grid" id="toggle-grid-btn"><i class="bi bi-grid-3x3"></i></button>
            <button class="icon-btn" title="Reset View" id="reset-view"><i class="bi bi-camera-repath"></i></button>
        </div>
    </header>

    {{ content }}
    
    <!-- Playground JavaScript -->
    <script src="{{ '/js/profile.js' | relative_url }}"></script>
    <script src="{{ '/js/geodesic-math.js' | relative_url }}"></script>
    <script src="{{ '/js/dihedral-playground.js' | relative_url }}"></script>
</body>
</html>
